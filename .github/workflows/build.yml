name: Build PandaMine VVU Levi 26.52.3

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Android cross toolchain
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: aarch64-linux-android

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Verify embedded loader patch
        run: |
          test -f tiers.bin
          grep -n -F 'register_custom_file' src/jniopts.rs
          grep -n -F 'pm5_vvu/tiers.bin' src/lib.rs
          grep -n -F 'hook_aaset();' src/lib.rs
          if grep -n -F 'No signature was found' src/lib.rs; then
            echo "WARNING: old signature code still exists as unused code; main() no longer calls it."
          fi

      - name: Build AArch64 library
        env:
          CARGO_TERM_COLOR: always
        run: cargo build --release --target aarch64-linux-android

      - name: Package .levipack
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/PandaMine_VVU_Levi_26.52.3
          cp manifest.json dist/PandaMine_VVU_Levi_26.52.3/manifest.json
          cp tiers.bin dist/PandaMine_VVU_Levi_26.52.3/tiers.bin
          cp target/aarch64-linux-android/release/libmtbinloader2.so \
             dist/PandaMine_VVU_Levi_26.52.3/libpanda_vvu_levi.so
          cd dist/PandaMine_VVU_Levi_26.52.3
          zip -9 -r ../PandaMine-VVU-Levi-26.52.3.levipack manifest.json libpanda_vvu_levi.so tiers.bin
          cd ..
          sha256sum PandaMine-VVU-Levi-26.52.3.levipack > SHA256SUMS.txt

      - name: Upload .levipack
        uses: actions/upload-artifact@v4
        with:
          name: PandaMine-VVU-Levi-26.52.3
          path: |
            dist/PandaMine-VVU-Levi-26.52.3.levipack
            dist/SHA256SUMS.txt
