name: Build PandaMine VVU Levi

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Checkout mtbinloader2-levi base
        uses: actions/checkout@v4
        with:
          repository: QYCottage/mtbinloader2-levi
          ref: v0.1.10-beta
          path: mtbinloader2-levi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Android cross toolchain
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: aarch64-linux-android

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Copy embedded tiers.bin
        run: cp mod/tiers.bin mtbinloader2-levi/tiers.bin

      - name: Apply PandaMine patch
        working-directory: mtbinloader2-levi
        run: python3 ../scripts/patch_mtbinloader2.py

      - name: Build AArch64 library
        working-directory: mtbinloader2-levi
        env:
          CARGO_TERM_COLOR: always
        run: cargo build --release --target aarch64-linux-android

      - name: Package .levipack
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/PandaMine_VVU_Levi_26.52.3
          cp manifest.json dist/PandaMine_VVU_Levi_26.52.3/manifest.json
          cp mod/tiers.bin dist/PandaMine_VVU_Levi_26.52.3/tiers.bin
          SO=$(find mtbinloader2-levi/target/aarch64-linux-android/release -maxdepth 1 -type f -name '*.so' | head -n 1)
          test -n "$SO"
          cp "$SO" dist/PandaMine_VVU_Levi_26.52.3/libpanda_vvu_levi.so
          cd dist/PandaMine_VVU_Levi_26.52.3
          zip -9 -r ../PandaMine-VVU-Levi-26.52.3.levipack manifest.json libpanda_vvu_levi.so tiers.bin
          cd ..
          sha256sum PandaMine-VVU-Levi-26.52.3.levipack > SHA256SUMS.txt

      - name: Upload .levipack
        uses: actions/upload-artifact@v4
        with:
          name: PandaMine-VVU-Levi-26.52.3
          path: |
            dist/PandaMine-VVU-Levi-26.52.3.levipack
            dist/SHA256SUMS.txt
